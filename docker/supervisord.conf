; Runs the app's three long-running processes as one container PID 1 —
; container-native equivalent of the three separate systemd units
; (swarmsentinel.service, ssai-agents.service, ssai-github.service) used on
; a bare-metal/manual install.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:swarmsentinel]
directory=/app/backend
command=gunicorn -w 2 --threads 4 --worker-class gthread -b 0.0.0.0:5000 --timeout 60 app:app
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ssai-agents]
directory=/app/backend
command=python3 agents/agent_runner.py
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Always running, but stays idle unless GITHUB_AUTOPUSH_ENABLED=true — see
; run-github-reporter.sh. Kept as its own supervisor program (rather than
; conditionally omitted) so this file doesn't need per-boot templating.
[program:ssai-github]
command=/docker/run-github-reporter.sh
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
